name: CI

# Manual only until the owner opts in, so pushes don't spend the repo's Actions minutes. To opt in, replace the
# trigger with: on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate -- --no-rebuild
      - run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run e2e
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
