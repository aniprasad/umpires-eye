name: CI

# Manual only for now, so pushes don't spend Actions minutes. To run on every push and pull request, replace the
# trigger with: on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate -- --no-rebuild
      - run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run e2e
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
